<!-- ==================== HEADER (TRONG LUỒNG BỐ CỤC) ==================== -->
<header class="header" id="site-header">
    <div class="header__container container">
        
        <!-- CỤM TRÁI: Logo & Nút Home -->
        <div class="header__left">
            <!-- 1. Logo -->
            <div class="header__logo logo">
                <a href="#!" class="header__logo-link">
                    <img src="./assets/icons/logo.svg" alt="Lịch Phong Thủy - Trang chủ" class="header__logo-img">
                </a>
            </div>

            <!-- 2. Icon Home -->
            <div class="header__home">
                <a href="#!" aria-label="Quay về Trang chủ" class="header__home-link">
                    <img src="./assets/icons/home.svg" alt="" aria-hidden="true" class="header__home-icon icon">
                </a>
            </div>
        </div>

        <!-- CỤM PHẢI: Ngày giờ, Ngôn ngữ, Theme, Đăng nhập & Nút Hamburger -->
        <div class="header__right">
            <!-- 3. Khối Ngày & Giờ -->
            <div class="header__datetime-wrapper" role="group" aria-label="Thời gian hiện tại">
                <div class="header__date-group">
                    <img src="./assets/icons/calendar.svg" alt="" aria-hidden="true" class="header__date-icon icon">
                    <time datetime="2024-05-24" class="header__date-text">24/05/2024</time>
                </div>

                <div class="header__time-group">
                    <img src="./assets/icons/clock.svg" alt="" aria-hidden="true" class="header__time-icon icon">
                    <time datetime="14:30:05" class="header__time-text">14:30:05</time>
                </div>
            </div>

            <!-- 4. Khối Ngôn ngữ -->
            <div class="header__lang-group">
                <details class="header__lang-details js-dropdown">
                    <summary class="header__lang-summary" aria-label="Chọn ngôn ngữ, hiện tại là Tiếng Việt">
                        <img src="./assets/icons/global.svg" alt="" aria-hidden="true" class="header__lang-icon icon">
                        <span class="header__lang-current">VN</span>
                        <img src="./assets/icons/arrow-down.svg" alt="" aria-hidden="true" class="header__lang-arrow icon">
                    </summary>
                    <ul class="header__lang-list">
                        <li class="header__lang-item">
                            <a href="#!" lang="vi" aria-current="true" class="header__lang-link header__lang-link--active">VN</a>
                        </li>
                        <li class="header__lang-item">
                            <a href="#!" lang="en" class="header__lang-link">EN</a>
                        </li>
                        <li class="header__lang-item">
                            <a href="#!" lang="ja" class="header__lang-link">JP</a>
                        </li>
                    </ul>
                </details>
            </div>

            <!-- 5. Khối Theme Ngũ hành -->
            <div class="header__theme-group">
                <details class="header__theme-details js-dropdown">
                    <summary class="header__theme-summary" aria-label="Chọn giao diện Ngũ hành">
                        <img src="./assets/icons/theme.svg" alt="" aria-hidden="true" class="header__theme-icon icon">
                    </summary>
                    <ul class="header__theme-list">
                        <li class="header__theme-item">
                            <button type="button" data-theme="earth" aria-pressed="true" class="btn header__theme-btn is-active">
                                <img src="./assets/icons/earth.svg" alt="" aria-hidden="true" class="header__theme-icon icon">
                                <span>Thổ</span>
                            </button>
                        </li>
                        <li class="header__theme-item">
                            <button type="button" data-theme="fire" aria-pressed="false" class="btn header__theme-btn">
                                <img src="./assets/icons/fire.svg" alt="" aria-hidden="true" class="header__theme-icon icon">
                                <span>Hoả</span>
                            </button>
                        </li>
                        <li class="header__theme-item">
                            <button type="button" data-theme="metal" aria-pressed="false" class="btn header__theme-btn">
                                <img src="./assets/icons/metal.svg" alt="" aria-hidden="true" class="header__theme-icon icon">
                                <span>Kim</span>
                            </button>
                        </li>
                        <li class="header__theme-item">
                            <button type="button" data-theme="water" aria-pressed="false" class="btn header__theme-btn">
                                <img src="./assets/icons/water.svg" alt="" aria-hidden="true" class="header__theme-icon icon">
                                <span>Thuỷ</span>
                            </button>
                        </li>
                        <li class="header__theme-item">
                            <button type="button" data-theme="wood" aria-pressed="false" class="btn header__theme-btn">
                                <img src="./assets/icons/wood.svg" alt="" aria-hidden="true" class="header__theme-icon icon">
                                <span>Mộc</span>
                            </button>
                        </li>
                    </ul>
                </details>
            </div>

            <!-- 6. Khối Đăng nhập -->
            <div class="header__auth">
                <button type="button" aria-haspopup="dialog" class="btn btn--login header__auth-btn">Đăng nhập</button>
            </div>

            <!-- 7. Nút Hamburger (Chỉ hiện trên Mobile để bật/tắt Sidebar) -->
            <button type="button" class="header__burger" id="burger-btn" aria-label="Mở menu Xem Ngày Tốt" aria-expanded="false" aria-controls="calendar-sidebar">
                <span class="header__burger-bar"></span>
                <span class="header__burger-bar"></span>
                <span class="header__burger-bar"></span>
            </button>
        </div>

    </div>
</header>

<!-- ==================== SIDEBAR TOOLTIP (NGOÀI LUỒNG BỐ CỤC) ==================== -->

            <li class="sidebar__item">

                </a>
            </li>
            <li class="sidebar__item">
                <a href="#!" class="sidebar__link">
                    <img src="./assets/icons/calendarYear.svg" alt="" aria-hidden="true" class="sidebar__img icon">
                    <span class="sidebar__tooltip">Năm</span>
                </a>
            </li>
            <li class="sidebar__item">
                <a href="#!" class="sidebar__link">
                    <img src="./assets/icons/partyFestival.svg" alt="" aria-hidden="true" class="sidebar__img icon">
                    <span class="sidebar__tooltip">Lễ tết</span>
                </a>
            </li>
            <li class="sidebar__item">
                <a href="#!" class="sidebar__link">
                    <img src="./assets/icons/ying-yang-2.svg" alt="" aria-hidden="true" class="sidebar__img icon">
                    <span class="sidebar__tooltip">Bát tự</span>
                </a>
            </li>
            <li class="sidebar__item">
                <a href="#!" class="sidebar__link">
                    <img src="./assets/icons/utilities.svg" alt="" aria-hidden="true" class="sidebar__img icon">
                    <span class="sidebar__tooltip">Tiện ích</span>
                </a>
            </li>
        </ul>
    </nav>
</aside>

<!-- Lớp nền mờ khi mở Sidebar trên Mobile -->
<div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
